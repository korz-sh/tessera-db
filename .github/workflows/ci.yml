name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev,experimental-turso]'
      - name: Test
        run: .venv/bin/python -m pytest tests/ -q
      - name: Build locked Lambda artifact
        run: |
          .venv/bin/pip install -q uv==0.11.6
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python scripts/build_lambda_artifact.py --output /tmp/tessera-lambda-ci.zip
